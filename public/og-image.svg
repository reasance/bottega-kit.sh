<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#f4f1ea"/>
  <rect x="80" y="76" width="11" height="11" fill="#1c1a17"/>
  <rect x="93" y="76" width="11" height="11" fill="#1c1a17"/>
  <rect x="80" y="89" width="11" height="11" fill="#1f7a4f"/>
  <rect x="93" y="89" width="11" height="11" fill="#2b5d9b"/>
  <g font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace">
    <text x="122" y="97" font-size="26" fill="#5b5650" letter-spacing="2">BOTTEGA-KIT · A CODING-AGENT LOOP ON YOUR MACHINE</text>
  </g>
  <line x1="80" y1="128" x2="1120" y2="128" stroke="#1c1a17" stroke-width="2"/>
  <g font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-weight="600" letter-spacing="-1">
    <text x="80" y="226" font-size="62" fill="#1c1a17">One plan you approve.</text>
    <text x="80" y="302" font-size="62" fill="#1c1a17">Rounds of build and review.</text>
    <text x="80" y="378" font-size="62" fill="#1c1a17">A pull request at the end.</text>
  </g>
  <g font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" fill="#5b5650">
    <text x="80" y="440" font-size="30">Claude Code and Codex, one role each, in a git worktree, with a receipt for every step.</text>
  </g>
  <g font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="21" fill="#1c1a17">
    <rect x="80" y="498" width="560" height="48" fill="none" stroke="#1c1a17" stroke-width="2"/>
    <text x="360" y="529" text-anchor="middle">new → plan → approve → run → pr</text>
    <rect x="664" y="498" width="456" height="48" fill="none" stroke="#1c1a17" stroke-width="2"/>
    <text x="892" y="529" text-anchor="middle">planner · implementer · reviewer · judge</text>
  </g>
</svg>
